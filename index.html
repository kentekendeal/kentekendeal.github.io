<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kenteken Check</title>
<meta name="description" content="Vul een kenteken in: specificaties, wat de auto waard is, of de vraagprijs eerlijk is en wat hij per maand kost.">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #16181d; --muted: #676d7a;
    --line: #e3e5ea; --accent: #1f6feb; --good: #1a7f37; --warn: #b54708; --bad: #c62828;
    --plate: #f7c600; --plate-blue: #1b3d8f; --field: #f8f9fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --card: #181b21; --text: #eceef2; --muted: #9aa1ad;
      --line: #2a2e37; --accent: #4c8dff; --good: #3fb950; --warn: #e3a008; --bad: #f05252;
      --field: #12151a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }

  #form { display: flex; gap: 8px; }
  .plate { flex: 1; display: flex; border-radius: 8px; overflow: hidden;
    border: 2px solid #111; background: var(--plate); }
  .plate .nl { background: var(--plate-blue); color: #fff; font-weight: 700;
    font-size: .8rem; display: flex; align-items: flex-end; justify-content: center;
    width: 36px; padding-bottom: 6px; }
  .plate input { flex: 1; min-width: 0; border: 0; background: transparent; color: #111;
    font: 700 1.6rem/1 "Arial Narrow", Arial, sans-serif; letter-spacing: 2px;
    text-transform: uppercase; padding: 12px; outline: none; text-align: center; }
  button { border: 0; border-radius: 8px; background: var(--accent); color: #fff;
    font-weight: 600; font-size: 1rem; padding: 0 20px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }

  .msg { margin-top: 16px; color: var(--muted); }
  .msg.error { color: var(--bad); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px; margin-top: 16px; }
  .title { font-size: 1.35rem; font-weight: 700; margin: 0; }
  .meta { color: var(--muted); margin: 2px 0 0; }
  h2 { font-size: 1rem; margin: 0 0 12px; }

  .inputs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 520px) { .inputs { grid-template-columns: 1fr; } }
  .inputs label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
  .inputs input { font: inherit; color: var(--text); background: var(--field);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; }
  .inputs input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .value { text-align: center; }
  .value .label { color: var(--muted); font-size: .9rem; }
  .value .range { font-size: 2rem; font-weight: 800; margin: 4px 0; }
  .note { color: var(--muted); font-size: .85rem; margin: 8px 0 0; }

  .verdict { text-align: center; border-width: 2px; }
  .verdict .big { font-size: 1.6rem; font-weight: 800; margin: 0; }
  .verdict.good { border-color: var(--good); } .verdict.good .big { color: var(--good); }
  .verdict.ok   { border-color: var(--accent); } .verdict.ok .big { color: var(--accent); }
  .verdict.warn { border-color: var(--warn); } .verdict.warn .big { color: var(--warn); }
  .verdict.bad  { border-color: var(--bad);  } .verdict.bad .big  { color: var(--bad); }
  .verdict p { margin: 6px 0 0; }

  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .badge { font-size: .85rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .badge.good { color: var(--good); border-color: currentColor; }
  .badge.warn { color: var(--warn); border-color: currentColor; }
  .badge.bad  { color: var(--bad);  border-color: currentColor; }

  dl { display: grid; grid-template-columns: 1fr auto; gap: 0; margin: 0; }
  dt, dd { padding: 8px 0; border-bottom: 1px solid var(--line); margin: 0; }
  dt { color: var(--muted); }
  dd { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
  dl .total { color: var(--text); font-weight: 700; border-bottom: 0; }
  footer { color: var(--muted); font-size: .8rem; margin-top: 24px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Kenteken Check</h1>
  <p class="sub">Specificaties, wat de auto waard is, of de vraagprijs eerlijk is en wat hij per maand kost.</p>

  <form id="form">
    <div class="plate"><span class="nl">NL</span>
      <input id="plate" placeholder="XX-123-X" maxlength="10" autocomplete="off" autofocus>
    </div>
    <button id="go">Check</button>
  </form>

  <div id="out"></div>

  <footer>Data: RDW Open Data. Waarde en kosten zijn schattingen, geen taxatie of officiële berekening.</footer>
</main>

<script src="model.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let state = null; // { car, fuel }
// ---------- rendering ----------
function renderAll() {
  const { car, fuel } = state;
  const fx = facts(car, fuel);
  const km = num($("km")?.value ?? "");
  const asking = num($("ask")?.value ?? "");
  const kmYear = num($("kmy")?.value ?? "") || 12000;

  const v = estimateValue(car, fx, km);
  let html = "";

  // value
  html += v.ok
    ? `<div class="card value">
         <div class="label">Je koopt deze auto ongeveer voor</div>
         <div class="range">${euro(v.low)} – ${euro(v.high)}</div>
         <p class="note">Nieuwprijs ${euro(v.price)} · ${v.age.toFixed(1)} jaar oud${v.notes.length ? " · " + esc(v.notes.join(", ")) : ""}.<br>
         ${v.withKm ? "Staat en opties zijn niet meegenomen." : "Vul de kilometerstand in voor een scherpere schatting."}</p>
       </div>`
    : `<div class="card value"><div class="label">Waardeschatting</div><p class="note">${esc(v.reason)}</p></div>`;

  // deal verdict
  if (v.ok && asking) {
    const [cls, title, text] = verdict(asking, v);
    html += `<div class="card verdict ${cls}"><p class="big">${esc(title)}</p><p>${esc(text)}</p>
             ${km == null ? `<p class="note">Tip: vul ook de kilometerstand in, dan is dit oordeel betrouwbaarder.</p>` : ""}</div>`;
  }

  // monthly costs
  const tax = roadTaxPerMonth(car, fx);
  const fuelCost = fuelPerMonth(fx, kmYear);
  let dep = null;
  if (v.ok) {
    const next = estimateValue(car, fx, km != null ? km + kmYear : null, 1);
    if (next.ok) dep = Math.max(0, (v.mid - next.mid) / 12);
  }
  const costRows = [];
  if (tax) costRows.push(["Wegenbelasting" + (tax.note ? ` (${tax.note})` : ""), tax.amount]);
  if (fuelCost) costRows.push([`${fx.isEV ? "Stroom" : "Brandstof"} (${fuelCost.use})`, fuelCost.amount]);
  if (dep != null) costRows.push(["Waardeverlies", dep]);
  if (costRows.length) {
    const total = costRows.reduce((s, [, a]) => s + a, 0);
    html += `<div class="card"><h2>Wat kost deze auto per maand?</h2>
      <dl>${costRows.map(([k, a]) => `<dt>${esc(k)}</dt><dd>${euro(a)}</dd>`).join("")}
        <dt class="total">Totaal (excl. verzekering en onderhoud)</dt><dd class="total">${euro(total)}</dd></dl>
      <p class="note">Bij ${kmYear.toLocaleString("nl-NL")} km per jaar. Wegenbelasting is een schatting voor een gemiddelde provincie (2026).
      Brandstof: benzine € ${FUEL_PRICE.benzine.toFixed(2)}, diesel € ${FUEL_PRICE.diesel.toFixed(2)}, stroom € ${FUEL_PRICE.elektriciteit.toFixed(2)}/kWh.</p></div>`;
  }

  $("results").innerHTML = html;
}

function renderCar() {
  const { car, fuel } = state;
  const fx = facts(car, fuel);
  const firstNL = parseDate(car.datum_eerste_tenaamstelling_in_nederland);
  const apk = parseDate(car.vervaldatum_apk);
  const year = fx.first ? fx.first.getFullYear() : "";
  const hp = fx.kw ? Math.round(fx.kw * 1.36) : null;
  const fuelLabel = fuel.map(x => x.brandstof_omschrijving).filter(Boolean).join(" + ");

  const badges = [];
  if (apk) {
    const days = (apk - Date.now()) / 864e5;
    badges.push(days < 0 ? ["bad", "APK verlopen"] : days < 60 ? ["warn", "APK verloopt binnenkort"] : ["good", "APK geldig"]);
  }
  if (car.tellerstandoordeel) badges.push(/onlogisch/i.test(car.tellerstandoordeel) ? ["bad", "Km-stand onlogisch"] : ["good", "Km-stand logisch"]);
  if (car.openstaande_terugroepactie_indicator === "Ja") badges.push(["warn", "Openstaande terugroepactie"]);
  if (car.wam_verzekerd === "Nee") badges.push(["bad", "Niet verzekerd"]);
  if (car.export_indicator === "Ja") badges.push(["warn", "Gemeld voor export"]);
  if (fx.first && firstNL && firstNL - fx.first > 180 * 864e5) badges.push(["warn", "Geïmporteerd"]);

  const f = fx.isEV ? fx.f : fx.main;
  const rows = [
    ["Kenteken", car.kenteken],
    ["Soort", car.voertuigsoort],
    ["Bouwjaar", year],
    ["Eerste toelating", fmtDate(fx.first)],
    ["Eerste keer op NL kenteken", fmtDate(firstNL)],
    ["APK tot", fmtDate(apk)],
    ["Brandstof", fuelLabel],
    ["Vermogen", fx.kw ? `${fx.kw} kW (${hp} pk)` : null],
    ["Motorinhoud", car.cilinderinhoud ? `${car.cilinderinhoud} cc` : null],
    ["Cilinders", car.aantal_cilinders],
    ["Verbruik (WLTP)", f.brandstof_verbruik_gecombineerd_wltp ? `${(+f.brandstof_verbruik_gecombineerd_wltp).toFixed(1)} l/100 km` : null],
    ["Stroomverbruik (WLTP)", fx.f.elektrisch_verbruik_enkel_elektrisch_wltp ? `${Math.round(fx.f.elektrisch_verbruik_enkel_elektrisch_wltp / 10)} kWh/100 km` : null],
    ["Actieradius (WLTP)", fx.f.actie_radius_enkel_elektrisch_wltp ? `${fx.f.actie_radius_enkel_elektrisch_wltp} km` : null],
    ["CO₂ (WLTP)", f.emissie_co2_gecombineerd_wltp ? `${f.emissie_co2_gecombineerd_wltp} g/km` : null],
    ["Emissieklasse", f.uitlaatemissieniveau],
    ["Kleur", known(car.eerste_kleur) ? cap(car.eerste_kleur) : null],
    ["Carrosserie", car.inrichting],
    ["Deuren / zitplaatsen", car.aantal_deuren || car.aantal_zitplaatsen ? `${car.aantal_deuren || "–"} / ${car.aantal_zitplaatsen || "–"}` : null],
    ["Leeggewicht", car.massa_ledig_voertuig ? `${(+car.massa_ledig_voertuig).toLocaleString("nl-NL")} kg` : null],
    ["Max. trekgewicht geremd", car.maximum_trekken_massa_geremd ? `${(+car.maximum_trekken_massa_geremd).toLocaleString("nl-NL")} kg` : null],
    ["Topsnelheid", car.maximale_constructiesnelheid ? `${car.maximale_constructiesnelheid} km/u` : null],
    ["Nieuwprijs (catalogus)", car.catalogusprijs ? euro(+car.catalogusprijs) : null],
  ].filter(([, val]) => val);

  $("out").innerHTML = `
    <div class="card">
      <p class="title">${esc(carName(car))}</p>
      <p class="meta">${esc([year, fuelLabel, hp ? hp + " pk" : ""].filter(Boolean).join(" · "))}</p>
      <div class="badges">${badges.map(([c, t]) => `<span class="badge ${c}">${esc(t)}</span>`).join("")}</div>
    </div>
    <div class="card">
      <h2>Staat de auto te koop? Vul de advertentie in</h2>
      <div class="inputs">
        <label>Kilometerstand<input id="km" inputmode="numeric" placeholder="bijv. 85000"></label>
        <label>Vraagprijs (€)<input id="ask" inputmode="numeric" placeholder="bijv. 8500"></label>
        <label>Jouw km per jaar<input id="kmy" inputmode="numeric" placeholder="12000"></label>
      </div>
    </div>
    <div id="results"></div>
    <div class="card">
      <h2>Specificaties</h2>
      <dl>${rows.map(([k, val]) => `<dt>${esc(k)}</dt><dd>${esc(val)}</dd>`).join("")}</dl>
    </div>`;

  // Prefill from link (?k=..&km=..&p=..&j=..) so a deal check can be shared.
  const q = new URLSearchParams(location.search);
  for (const [id, key] of [["km", "km"], ["ask", "p"], ["kmy", "j"]]) {
    if (q.get(key)) $(id).value = q.get(key);
    $(id).addEventListener("input", () => { renderAll(); updateLink(); });
  }
  renderAll();
}

function updateLink() {
  const p = new URLSearchParams({ k: state.car.kenteken });
  for (const [id, key] of [["km", "km"], ["ask", "p"], ["kmy", "j"]]) {
    const n = num($(id).value);
    if (n) p.set(key, n);
  }
  history.replaceState(null, "", "?" + p);
}

async function search(raw) {
  const plate = clean(raw);
  if (plate.length < 4) {
    $("out").innerHTML = `<p class="msg error">Vul een geldig kenteken in.</p>`;
    return;
  }
  $("go").disabled = true;
  $("out").innerHTML = `<p class="msg">Bezig met opzoeken…</p>`;
  try {
    const { car, fuel } = await lookup(plate);
    if (!car) { $("out").innerHTML = `<p class="msg error">Geen voertuig gevonden met kenteken ${esc(plate)}.</p>`; return; }
    const keep = clean(new URLSearchParams(location.search).get("k") || "") === plate;
    state = { car, fuel };
    if (!keep) history.replaceState(null, "", `?k=${plate}`); // shareable link
    renderCar();
  } catch (err) {
    $("out").innerHTML = `<p class="msg error">${esc(err.message || "Er ging iets mis.")}</p>`;
  } finally {
    $("go").disabled = false;
  }
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); search($("plate").value); });

const initial = new URLSearchParams(location.search).get("k");
if (initial) { $("plate").value = initial; search(initial); }
</script>
</body>
</html>
