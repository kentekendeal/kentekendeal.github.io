# Refreshes the model pages (/auto/ and /en/cars/), /en/index.html and sitemap.xml with the latest RDW data.
# Runs automatically on the 1st of every month, and can be started by hand under
# GitHub → Actions → "Update model pages" → "Run workflow".
name: Update model pages

on:
  schedule:
    - cron: "0 4 1 * *"   # 04:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate pages from RDW data
        run: python -I tools/build_pages.py

      - name: Commit and push if anything changed
        id: commit
        run: |
          git config user.name "kentekendeal-bot"
          git config user.email "354666399+kentekendeal@users.noreply.github.com"
          git add auto en sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Monthly data update ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made by this workflow may not trigger a Pages build on their own, so ask for one.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
